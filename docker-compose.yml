version: "3.9"

# 3-node CockroachDB cluster + Prometheus/Grafana monitoring, for local
# development/testing.
#
# Nodes run under the "cockroach" profile, monitoring under "monitoring" —
# both are requested together by default (see Makefile: `make up`).
#
# After `make up`, initialize the cluster once with:
#   make init
# Then open:
#   DB Console: http://localhost:8080
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3000  (admin/admin)

x-cockroach-defaults: &cockroach-defaults
  image: cockroachdb/cockroach:v23.2.11
  command: start --insecure --join=roach1:26257,roach2:26257,roach3:26257 --cache=.25 --max-sql-memory=.25
  restart: unless-stopped
  profiles:
    - cockroach
  networks:
    - roachnet

services:
  roach1:
    <<: *cockroach-defaults
    container_name: roach1
    hostname: roach1
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - roach1-data:/cockroach/cockroach-data

  roach2:
    <<: *cockroach-defaults
    container_name: roach2
    hostname: roach2
    ports:
      - "26258:26257"
      - "8081:8080"
    volumes:
      - roach2-data:/cockroach/cockroach-data

  roach3:
    <<: *cockroach-defaults
    container_name: roach3
    hostname: roach3
    ports:
      - "26259:26257"
      - "8082:8080"
    volumes:
      - roach3-data:/cockroach/cockroach-data

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - roachnet

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    profiles:
      - monitoring
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - roachnet

networks:
  roachnet:
    driver: bridge

volumes:
  roach1-data:
  roach2-data:
  roach3-data:
  prometheus-data:
  grafana-data:
